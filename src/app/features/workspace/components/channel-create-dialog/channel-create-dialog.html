<div class="backdrop" (click)="closeRequested.emit()">
  <section
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="create-channel-title"
    (click)="$event.stopPropagation()"
  >
    <div class="dialog-heading">
      <div>
        <p class="eyebrow">DABubble</p>
        <h2 id="create-channel-title">Create channel</h2>
      </div>
      <button class="close" type="button" aria-label="Close dialog" (click)="closeRequested.emit()">
        ×
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Channel name
        <input type="text" formControlName="name" placeholder="e.g. Development team" />
      </label>
      @if (form.controls.name.touched && form.controls.name.hasError('required')) {
        <p class="field-error">Please enter a channel name.</p>
      }

      <label>
        Description
        <textarea formControlName="description" rows="3" placeholder="What is this channel about?"></textarea>
      </label>

      <fieldset>
        <legend>Members</legend>
        <div class="user-list">
          @for (user of users(); track user.uid) {
            <label class="user-option">
              <input
                type="checkbox"
                [checked]="isSelected(user.uid)"
                [disabled]="user.uid === auth.currentUser?.uid"
                (change)="toggleMember(user.uid)"
              />
              <span class="avatar">{{ user.displayName.charAt(0).toUpperCase() }}</span>
              <span>{{ user.displayName }}</span>
            </label>
          }
        </div>
      </fieldset>

      @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
      }

      <div class="actions">
        <button class="secondary" type="button" (click)="closeRequested.emit()">Cancel</button>
        <button class="primary" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Creating…' : 'Create' }}
        </button>
      </div>
    </form>
  </section>
</div>
