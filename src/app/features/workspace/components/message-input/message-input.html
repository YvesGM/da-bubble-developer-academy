<div class="composer">
  @if (trigger()) {
    <div class="suggestions">
      @if (trigger() === '@') {
        @for (user of matchingUsers(); track user.uid) {
          <button type="button" (click)="chooseUser(user)">@{{ user.displayName }}</button>
        }
      } @else {
        @for (channel of matchingChannels(); track channel.id) {
          <button type="button" (click)="chooseChannel(channel)">#{{ channel.name }}</button>
        }
      }
    </div>
  }

  @if (showEmojiPicker()) {
    <div class="picker">
      <app-emoji-picker [recent]="recentEmojis" (emojiSelected)="insertEmoji($event)" />
    </div>
  }

  <textarea
    #messageField
    rows="3"
    [disabled]="sending()"
    [placeholder]="placeholder"
    [ngModel]="text()"
    (ngModelChange)="updateText($event)"
    (keydown.enter)="handleEnter($event)"
  ></textarea>

  @if (sendError()) {
    <p class="composer-error" role="alert">{{ sendError() }}</p>
  }

  <div class="composer-actions">
    <button
      type="button"
      class="icon-button"
      aria-label="Emoji auswählen"
      (click)="showEmojiPicker.set(!showEmojiPicker())"
    >
      <img src="/assets/emoji.svg" alt="" />
    </button>
    <button type="button" class="icon-button" aria-label="Person erwähnen" (click)="insertMentionTrigger()">
      <img src="/assets/mention.svg" alt="" />
    </button>
    <button type="button" class="send-button" aria-label="Nachricht senden" [disabled]="!text().trim() || sending()" (click)="submit()">
      <img src="/assets/send.svg" alt="" />
    </button>
  </div>
</div>
