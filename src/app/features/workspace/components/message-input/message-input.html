<div class="composer">
  @if (trigger()) {
    <div class="suggestions">
      @if (trigger() === '@') {
        @for (user of matchingUsers(); track user.uid) {
          <button type="button" class="suggestion-option" (click)="chooseUser(user)">
            <span class="suggestion-avatar">
              <app-avatar [avatarId]="user.avatarId" [name]="user.displayName" size="medium" />
              <app-presence-indicator [userId]="user.uid" />
            </span>
            <span class="suggestion-label">{{ user.displayName }}</span>
          </button>
        }
      } @else {
        @for (channel of matchingChannels(); track channel.id) {
          <button type="button" class="suggestion-option" (click)="chooseChannel(channel)">
            <span class="suggestion-hash" aria-hidden="true">#</span>
            <span class="suggestion-label">{{ channel.name }}</span>
          </button>
        }
      }
    </div>
  }

  @if (showEmojiPicker()) {
    <div class="picker">
      <app-emoji-picker [recent]="recentEmojis" (emojiSelected)="insertEmoji($event)" />
    </div>
  }

  <textarea appInputCaret
    #messageField
    rows="3"
    [disabled]="sending()"
    aria-label="Nachricht verfassen"
    [placeholder]="placeholder"
    [ngModel]="text()"
    (ngModelChange)="updateText($event)"
    (keydown.enter)="handleEnter($event)"
  ></textarea>

  @if (sendError()) {
    <p class="composer-error" role="alert">{{ sendError() }}</p>
  }

  <div class="composer-actions">
    <button
      type="button"
      class="icon-button"
      aria-label="Emoji auswählen"
      [attr.aria-expanded]="showEmojiPicker()"
      (click)="toggleEmojiPicker()"
    >
      <img src="/assets/emoji.svg" alt="" />
    </button>
    <button type="button" class="icon-button" aria-label="Person erwähnen" (click)="insertMentionTrigger()">
      <img src="/assets/mention.svg" alt="" />
    </button>
    <button type="button" class="send-button" aria-label="Nachricht senden" [disabled]="!sendAction || !text().trim() || sending()" (click)="submit()">
      <img src="/assets/send.svg" alt="" />
    </button>
  </div>
</div>
