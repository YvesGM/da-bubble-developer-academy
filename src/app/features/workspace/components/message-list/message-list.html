<section class="message-list" aria-live="polite">
  @for (message of messages; track message.id; let index = $index) {
    @if (showDateSeparator(index) && dateLabel(message)) {
      <div class="date-separator"><span>{{ dateLabel(message) }}</span></div>
    }

    <app-message-item
      [target]="target"
      [message]="message"
      [recentEmojis]="recentEmojis"
      (threadRequested)="threadRequested.emit($event)"
      (userRequested)="userRequested.emit($event)"
    />
  } @empty {
    <div class="empty-state">
      <strong>{{ emptyTitle }}</strong>
      <span>{{ emptyText }}</span>
    </div>
  }
</section>
