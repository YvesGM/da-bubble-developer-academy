<aside class="thread-panel">
  <header>
    <div>
      <span>Thread</span>
      <strong>{{ parent().authorName }}</strong>
    </div>
    <button type="button" aria-label="Close thread" (click)="closeRequested.emit()">×</button>
  </header>

  <app-message-item
    [target]="target()"
    [message]="parent()"
    [recentEmojis]="recentEmojis()"
    [compactReactions]="true"
  />

  <div class="divider">{{ replies().length }} replies</div>

  <div class="replies">
    @for (reply of replies(); track reply.id) {
      <app-message-item
        [target]="target()"
        [message]="reply"
        [parentMessageId]="parent().id"
        [recentEmojis]="recentEmojis()"
        [compactReactions]="true"
      />
    }
  </div>

  <app-message-input
    [channels]="channels()"
    [users]="users()"
    [recentEmojis]="recentEmojis()"
    placeholder="Reply in thread"
    (sendRequested)="sendReply($event)"
  />
</aside>
