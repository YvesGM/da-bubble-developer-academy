<div class="backdrop" (click)="closeRequested.emit()">
  <section class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <header>
      <h2>Workspace bearbeiten</h2>
      <button type="button" aria-label="Dialog schließen" (click)="closeRequested.emit()">×</button>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Workspace-Name
        <input type="text" formControlName="workspaceName" />
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <div class="actions">
        <button type="button" class="secondary" (click)="closeRequested.emit()">Abbrechen</button>
        <button type="submit" class="primary">Speichern</button>
      </div>
    </form>
  </section>
</div>
