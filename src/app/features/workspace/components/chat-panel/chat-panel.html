<section class="chat-panel">
  <div class="chat-main">
    <app-message-list
      [target]="target()"
      [messages]="messages()"
      [recentEmojis]="recentEmojis()"
      [emptyTitle]="emptyTitle()"
      [emptyText]="emptyText()"
      (threadRequested)="threadMessage.set($event)"
      (userRequested)="userRequested.emit($event)"
    />

    <app-message-input
      [channels]="channels()"
      [users]="availableMentionUsers()"
      [recentEmojis]="recentEmojis()"
      [placeholder]="inputPlaceholder()"
      [focusKey]="target().id"
      (sendRequested)="sendMessage($event)"
      (emojiUsed)="rememberEmoji($event)"
    />
  </div>

  @if (threadMessage(); as parent) {
    <app-thread-panel
      [target]="target()"
      [parent]="parent"
      [channels]="channels()"
      [users]="availableMentionUsers()"
      [recentEmojis]="recentEmojis()"
      (closeRequested)="threadMessage.set(null)"
      (userRequested)="userRequested.emit($event)"
    />
  }
</section>
