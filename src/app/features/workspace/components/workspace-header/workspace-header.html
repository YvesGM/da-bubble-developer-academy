<header class="workspace-header">
  <div class="brand" aria-label="DABubble">
    <img class="brand-mark" src="/assets/logo.svg" alt="" />
    <img class="brand-name" src="/assets/logo-name.svg" alt="DABubble" />
  </div>

  <app-search-box (userSelected)="userSelected.emit($event)" />

  <div class="user-area">
    <button
      type="button"
      class="profile-button"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
    >
      <span class="profile-name">{{ displayName }}</span>
      <app-avatar [avatarId]="avatarId" [name]="displayName" size="large" />
      <span class="profile-chevron" aria-hidden="true">⌄</span>
    </button>

    @if (menuOpen()) {
      <div class="user-menu">
        @if (profileEnabled) {
          <button type="button" (click)="openProfile()">Profil</button>
        }
        <button type="button" (click)="logout()">Abmelden</button>
      </div>
    }
  </div>
</header>
