<header class="workspace-header">
  <a class="brand" routerLink="/workspace" aria-label="DABubble home">
    <span class="brand-mark">D</span>
    <span>DABubble</span>
  </a>

  <app-search-box (userSelected)="userSelected.emit($event)" />

  <div class="user-area">
    <button type="button" class="profile-button" (click)="menuOpen.set(!menuOpen())">
      <app-avatar [avatarId]="avatarId" [name]="displayName" size="small" />
      <span>{{ displayName }}</span>
      <span aria-hidden="true">⌄</span>
    </button>

    @if (menuOpen()) {
      <div class="user-menu">
        @if (profileEnabled) {
          <button type="button" (click)="openProfile()">Profile</button>
        }
        <button type="button" (click)="logout()">Log out</button>
      </div>
    }
  </div>
</header>
