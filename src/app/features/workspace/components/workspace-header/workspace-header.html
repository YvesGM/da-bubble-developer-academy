<header class="workspace-header">
  <div class="brand" aria-label="DABubble">
    <img class="brand-mark" src="/assets/logo.svg" alt="" />
    <img class="brand-name" src="/assets/logo-name.svg" alt="DABubble" />
  </div>

  <app-search-box [placeholder]="workspaceName + ' durchsuchen'" (userSelected)="userSelected.emit($event)" />
  @if (conversationOpen) {
    <div class="mobile-conversation-name"><a routerLink="/workspace" aria-label="Zurück zum Hauptmenü"><img src="/assets/chevron-half-down.svg" alt="" /></a><img src="/assets/workspace-icon.svg" alt="" /><strong>{{ workspaceName }}</strong></div>
  }

  <div class="user-area">
    <button
      type="button"
      class="profile-button"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="profile-name">{{ displayName }}</span>
      <span class="profile-avatar">
        <app-avatar [avatarId]="avatarId" [name]="displayName" size="large" />
        @if (profileEnabled && userId) {
          <app-presence-indicator [userId]="userId" />
        }
      </span>
      <span class="profile-chevron" aria-hidden="true"></span>
    </button>

    <div class="user-menu-backdrop" [class.is-open]="menuOpen()"
      aria-hidden="true" (click)="closeMenu()"></div>
    <div class="user-menu" [class.is-open]="menuOpen()"
      [class.is-dragging]="dragging()"
      [style.--sheet-drag]="dragOffset() + 'px'"
      [attr.aria-hidden]="!menuOpen()"
      [attr.inert]="menuOpen() ? null : ''">
      <div class="user-menu-handle" aria-hidden="true"
        (pointerdown)="startMenuDrag($event)"
        (pointermove)="moveMenuDrag($event)"
        (pointerup)="finishMenuDrag()"
        (pointercancel)="cancelMenuDrag()"></div>
      @if (profileEnabled) {
        <button type="button" class="profile-action" (click)="openProfile()">
          <span class="menu-action-icon menu-action-icon--profile" aria-hidden="true"></span>
          Profil
        </button>
      }
      <button type="button" class="logout-action" (click)="logout()">
        <span class="menu-action-icon menu-action-icon--logout" aria-hidden="true"></span>
        Abmelden
      </button>
    </div>
  </div>
</header>
