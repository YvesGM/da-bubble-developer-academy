<div class="search">
  <input
    type="search"
    placeholder="Search DABubble"
    [value]="query()"
    (input)="query.set($any($event.target).value)"
    (focus)="focused.set(true)"
    (blur)="focused.set(false)"
    aria-label="Search messages"
  />

  @if (focused() && query().trim()) {
    <div class="results">
      @for (result of results(); track result.target.type + result.target.id + result.message.id) {
        <button type="button" (mousedown)="$event.preventDefault()" (click)="openResult(result)">
          <strong>{{ result.conversationLabel }}</strong>
          <span>{{ result.message.authorName }}: {{ result.message.text }}</span>
        </button>
      } @empty {
        <p>No matching messages.</p>
      }
    </div>
  }
</div>
