<div class="search">
  <input appInputCaret
    type="search"
    [placeholder]="placeholder"
    [value]="query()"
    (input)="query.set($any($event.target).value)"
    (focus)="focused.set(true)"
    (blur)="focused.set(false)"
    aria-label="Benutzer, Channels und Nachrichten durchsuchen"
  />

  @if (!query().trim() && !focused()) {
    <span class="mobile-search-placeholder" aria-hidden="true">Gehe zu...</span>
  }

  <img class="search-icon" src="/assets/search.svg" alt="" aria-hidden="true" />

  @if (focused() && query().trim()) {
    <div class="results">
      @for (result of results(); track result.type + result.id) {
        <button type="button" (mousedown)="$event.preventDefault()" (click)="openResult(result)">
          <strong>{{ result.label }}</strong>
          @if (result.type === 'user') {
            <span>{{ result.user.email }}</span>
          } @else if (result.type === 'channel') {
            <span>Channel</span>
          } @else {
            <span>{{ result.message.authorName }}: {{ result.message.text }}</span>
          }
        </button>
      } @empty {
        <p>Keine passenden Ergebnisse.</p>
      }
    </div>
  }
</div>
