<div class="backdrop" (click)="closeRequested.emit()">
  <section class="dialog" role="dialog" aria-modal="true"
    [style.top.px]="position.top" [style.right.px]="position.right"
    [style.max-height]="'calc(100dvh - ' + (position.top + 16) + 'px)'"
    (click)="$event.stopPropagation()">
    <div class="dialog-scroll">
      <header>
        <h2>Mitglieder</h2>
        <button type="button" aria-label="Mitglieder schließen" (click)="closeRequested.emit()"><img src="/assets/close.svg" alt="" /></button>
      </header>

      <app-channel-members-content
        [members]="members"
        [guestAccess]="guestAccess"
        [currentUserId]="currentUserId"
        [canAdd]="canAdd"
        (userSelected)="userSelected.emit($event)"
        (addRequested)="addRequested.emit()"
      />
    </div>
  </section>
</div>
