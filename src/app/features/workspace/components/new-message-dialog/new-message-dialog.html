<div class="backdrop" (click)="closeRequested.emit()">
  <section class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <header>
      <h2>New message</h2>
      <button type="button" aria-label="Close" (click)="closeRequested.emit()">×</button>
    </header>

    <input
      type="search"
      placeholder="Find a person"
      [value]="query()"
      (input)="query.set($any($event.target).value)"
    />

    <div class="user-list">
      @for (user of filteredUsers(); track user.uid) {
        <button type="button" class="user" (click)="userSelected.emit(user.uid)">
          <span>{{ user.displayName.charAt(0).toUpperCase() }}</span>
          <div>
            <strong>{{ user.displayName }}</strong>
            <small>{{ user.email }}</small>
          </div>
        </button>
      } @empty {
        <p>No matching users.</p>
      }
    </div>
  </section>
</div>
