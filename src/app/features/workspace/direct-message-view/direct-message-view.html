<section class="dm-view">
  <header>
    <a class="mobile-back" routerLink="/workspace" aria-label="Zurück zu den Unterhaltungen">←</a>

    @if (partner(); as currentPartner) {
      <button type="button" class="partner" (click)="selectedUser.set(currentPartner)">
        <span class="partner-avatar">
          <app-avatar [avatarId]="currentPartner.avatarId" [name]="currentPartner.displayName" size="large" />
          <app-presence-indicator [userId]="currentPartner.uid" />
        </span>
        <span class="partner-name">
          {{ currentPartner.displayName }}{{ isSelfConversation() ? ' (Du)' : '' }}
        </span>
      </button>
    } @else {
      <h1>Direktnachricht</h1>
    }
  </header>

  <div class="chat-area">
    <app-chat-panel
      [target]="target()"
      [mentionUsers]="participantUsers()"
      [inputPlaceholder]="isSelfConversation() ? 'Notiz an dich selbst' : 'Nachricht an ' + (partner()?.displayName ?? '')"
      [emptyTitle]="isSelfConversation() ? 'Dein persönlicher Bereich' : 'Noch keine Nachrichten.'"
      [emptyText]="isSelfConversation() ? 'Hier kannst du Notizen, Links und To-dos für dich festhalten.' : 'Starte die Unterhaltung unten.'"
      (userRequested)="openProfile($event)"
    />
  </div>
</section>

@if (selectedUser(); as user) {
  <app-profile-card
    [user]="user"
    [ownProfile]="user.uid === currentUserId()"
    [messageEnabled]="false"
    (closeRequested)="selectedUser.set(null)"
    (editRequested)="openProfileEditor()"
  />
}

@if (showProfileEditor()) {
  <app-profile-dialog (closeRequested)="showProfileEditor.set(false)" />
}
