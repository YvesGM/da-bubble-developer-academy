<section class="new-message-view">
  <header>
    <a class="mobile-back" routerLink="/workspace" aria-label="Zurück zu den Unterhaltungen">←</a>
    <h1>Neue Nachricht</h1>
  </header>

  <label class="to-field">
    <span>An:</span>
    <input
      type="search"
      placeholder="#channel, oder @jemand oder E-Mail Adresse"
      [value]="query()"
      (input)="updateQuery($any($event.target).value)"
      autofocus
    />
  </label>

  <div class="results">
    @if (query().trim() && !recipientSelected()) {
      @if (mode() === '#') {
        @for (channel of filteredChannels(); track channel.id) {
          <button type="button" (click)="selectChannel(channel.id)">
            <strong># {{ channel.name }}</strong>
            <span>{{ channel.description }}</span>
          </button>
        } @empty {
          <p>Keine passenden Channels.</p>
        }
      } @else {
        @for (user of filteredUsers(); track user.uid) {
          <button type="button" (click)="selectUser(user.uid)">
            <strong>{{ user.displayName }}{{ isCurrentUser(user.uid) ? ' (Du)' : '' }}</strong>
            <span>{{ user.email }}</span>
          </button>
        } @empty {
          <p>Keine passenden Personen.</p>
        }
      }
    }
  </div>

  <div class="new-message-composer">
    <app-message-input
      [users]="users()"
      [channels]="channels()"
      [autoFocus]="false"
      [sendAction]="recipientSelected() ? sendAction : undefined"
      placeholder="Nachricht schreiben"
    />
  </div>
</section>
