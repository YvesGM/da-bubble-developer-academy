<main class="workspace">
  <app-workspace-header
    [displayName]="displayName"
    (profileRequested)="showProfile.set(true)"
    (logoutRequested)="logout()"
  />

  <div class="workspace-body" [class.collapsed]="sidebarCollapsed()">
    <app-workspace-sidebar
      [channels]="channels()"
      [directMessages]="directMessages()"
      [users]="users()"
      [currentUserId]="currentUserId"
      [guest]="isGuest"
      [collapsed]="sidebarCollapsed()"
      (createRequested)="showCreateChannel.set(true)"
      (newMessageRequested)="showNewMessage.set(true)"
      (collapseRequested)="sidebarCollapsed.update(value => !value)"
    />

    <section class="workspace-content">
      <router-outlet />
    </section>
  </div>

  @if (showCreateChannel()) {
    <app-channel-create-dialog
      (closeRequested)="showCreateChannel.set(false)"
      (channelCreated)="selectCreatedChannel($event)"
    />
  }

  @if (showNewMessage()) {
    <app-new-message-dialog
      [users]="users()"
      [currentUserId]="currentUserId"
      (closeRequested)="showNewMessage.set(false)"
      (userSelected)="startDirectMessage($event)"
    />
  }

  @if (showProfile() && !isGuest) {
    <app-profile-dialog (closeRequested)="showProfile.set(false)" />
  }
</main>
