<main class="workspace">
  <app-workspace-header
    [conversationOpen]="conversationOpen"
    [workspaceName]="workspaceName"
    [displayName]="displayName"
    [avatarId]="avatarId"
    [profileEnabled]="!isGuest"
    (profileRequested)="openOwnProfile()"
    (userSelected)="selectedUser.set($event)"
    (logoutRequested)="logout()"
  />

  <button
    type="button"
    class="workspace-sidebar-toggle"
    [class.is-collapsed]="sidebarCollapsed()"
    [attr.aria-label]="sidebarCollapsed() ? 'Workspace-Menü öffnen' : 'Workspace-Menü schließen'"
    (click)="toggleSidebar()"
  >
    <img
      src="/assets/sidebar-collapse.svg"
      [class.is-collapsed]="sidebarCollapsed()"
      alt=""
    />
    <span>{{ sidebarCollapsed() ? 'Workspace-Menü öffnen' : 'Workspace-Menü schließen' }}</span>
  </button>

  <div
    class="workspace-body"
    [class.collapsed]="sidebarCollapsed()"
    [class.conversation-open]="conversationOpen"
  >
    <app-workspace-sidebar
      [channels]="channels()"
      [directMessages]="directMessages()"
      [users]="users()"
      [currentUserId]="currentUserId"
      [workspaceName]="workspaceName"
      [guest]="isGuest"
      (createRequested)="showCreateChannel.set(true)"
      (newMessageRequested)="openNewMessage()"
      (workspaceEditRequested)="showWorkspaceEditor.set(true)"
    />

    <section class="workspace-content">
      <router-outlet />
    </section>
  </div>

  @if (showCreateChannel()) {
    <app-channel-create-dialog
      [workspaceName]="workspaceName"
      (closeRequested)="showCreateChannel.set(false)"
      (channelCreated)="selectCreatedChannel($event)"
    />
  }

  @if (selectedUser(); as user) {
    <app-profile-card
      [user]="user"
      [ownProfile]="user.uid === currentUserId"
      [messageEnabled]="!isGuest"
      (closeRequested)="selectedUser.set(null)"
      (editRequested)="openProfileEditor()"
      (messageRequested)="startDirectMessage($event)"
    />
  }

  @if (showProfileEditor() && !isGuest) {
    <app-profile-dialog (closeRequested)="showProfileEditor.set(false)" />
  }

  @if (showWorkspaceEditor() && !isGuest) {
    <app-workspace-name-dialog
      [workspaceName]="workspaceName"
      (closeRequested)="showWorkspaceEditor.set(false)"
      (saveRequested)="saveWorkspaceName($event)"
    />
  }
</main>
