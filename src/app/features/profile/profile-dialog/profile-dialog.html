<div class="backdrop" (click)="closeRequested.emit()">
  <section class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <header>
      <h2>Dein Profil bearbeiten</h2>
      <button type="button" aria-label="Profil schließen" (click)="closeRequested.emit()">×</button>
    </header>

    <form [formGroup]="form" (ngSubmit)="save()" novalidate>
      <div class="profile-preview">
        <app-avatar
          [avatarId]="avatarId()"
          [name]="form.controls.displayName.value || 'Profil'"
          size="hero"
        />
      </div>

      <label>
        <span class="field-label">
          <img src="/assets/person-icon.svg" alt="" />
          Vollständiger Name
        </span>
        <input appInputCaret type="text" formControlName="displayName" />
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <div class="actions">
        <button type="button" class="secondary" (click)="closeRequested.emit()">Abbrechen</button>
        <button type="submit" class="primary" [disabled]="saving()">Speichern</button>
      </div>
    </form>
  </section>
</div>
