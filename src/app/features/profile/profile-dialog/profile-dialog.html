<div class="backdrop" (click)="closeRequested.emit()">
  <section class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <header>
      <h2>Dein Profil bearbeiten</h2>
      <button type="button" aria-label="Profil schließen" (click)="closeRequested.emit()">×</button>
    </header>

    <form [formGroup]="form" (ngSubmit)="save()" novalidate>
      <div class="profile-preview">
        <app-avatar
          [avatarId]="form.controls.avatarId.value"
          [name]="form.controls.displayName.value || 'Profil'"
          size="hero"
        />
      </div>

      <label>
        Vollständiger Name
        <input type="text" formControlName="displayName" />
      </label>

      <fieldset>
        <legend>Avatar auswählen</legend>
        <div class="avatar-grid">
          @for (avatarId of avatarIds; track avatarId; let index = $index) {
            <button
              type="button"
              class="avatar-option"
              [class.selected]="form.controls.avatarId.value === avatarId"
              (click)="selectAvatar(avatarId)"
              [attr.aria-label]="'Avatar ' + (index + 1) + ' auswählen'"
            >
              <app-avatar [avatarId]="avatarId" [name]="'Avatar ' + (index + 1)" size="option" />
            </button>
          }
        </div>
      </fieldset>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <div class="actions">
        <button type="button" class="secondary" (click)="closeRequested.emit()">Abbrechen</button>
        <button type="submit" class="primary" [disabled]="saving()">Speichern</button>
      </div>
    </form>
  </section>
</div>
