<div class="backdrop" (click)="closeRequested.emit()">
  <section class="card" [class.own-profile]="ownProfile" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <header>
      <h2>Profil</h2>
      <button type="button" aria-label="Profil schließen" (click)="closeRequested.emit()">×</button>
    </header>

    <div class="profile-avatar">
      <app-avatar [avatarId]="user.avatarId" [name]="user.displayName" size="hero" />
    </div>

    <div class="name-row">
      <h3>{{ user.displayName }}</h3>
      @if (ownProfile) {
        <button type="button" class="link-button" (click)="editRequested.emit()">Bearbeiten</button>
      }
    </div>

    <div class="status">
      <app-presence-indicator [userId]="user.uid" [showLabel]="true" />
    </div>

    <div class="email">
      <div class="email-heading">
        <img src="/assets/email-icon.svg" alt="" />
        <strong>E-Mail-Adresse</strong>
      </div>
      <a [href]="'mailto:' + user.email">{{ user.email }}</a>
    </div>

    @if (!ownProfile && messageEnabled) {
      <button type="button" class="primary" (click)="messageRequested.emit(user.uid)">
        Nachricht
      </button>
    }
  </section>
</div>
