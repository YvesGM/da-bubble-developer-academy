<main class="auth-shell">
  <header class="auth-shell-header">
    <a class="auth-brand" routerLink="/login" aria-label="DABubble login">
      <img class="auth-brand-mark" src="/assets/logo.svg" alt="" />
      <img class="auth-brand-name" src="/assets/logo-name.svg" alt="DABubble" />
    </a>

    @if (showSignup) {
      <div class="auth-signup-prompt">
        <span>New to DABubble?</span>
        <a routerLink="/register">Create account</a>
      </div>
    }
  </header>

  <section class="auth-shell-stage">
    <ng-content />
  </section>

  <footer class="auth-shell-footer" aria-label="Legal information">
    <span>Legal notice</span>
    <span>Privacy policy</span>
  </footer>
</main>
