<main class="auth-page">
  <section class="auth-card">
    <p class="eyebrow">DABubble</p>
    <h1>Forgot password?</h1>
    <p class="intro">Enter your email address to receive reset instructions.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="field-error">Please enter a valid email address.</p>
      }

      @if (message()) {
        <p class="success-message">{{ message() }}</p>
      }

      @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="submitting()">Send reset email</button>
    </form>

    <a routerLink="/login">Back to login</a>
  </section>
</main>
