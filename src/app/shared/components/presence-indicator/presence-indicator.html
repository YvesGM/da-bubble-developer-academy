<span class="presence-wrap" [class.is-online]="online()">
  <span
    class="presence"
    [class.online]="online()"
    [attr.aria-label]="online() ? 'Online' : 'Offline'"
    [title]="online() ? 'Online' : 'Offline'"
  ></span>
  @if (showLabel()) {
    <span>{{ online() ? 'Aktiv' : 'Offline' }}</span>
  }
</span>
