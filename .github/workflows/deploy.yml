name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dabubble-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular production bundle
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: npm run build -- --configuration production

      - name: Deploy to FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_DIR="./dist/dabubble/browser"
          REMOTE_DIR="${FTP_REMOTE_DIR:-/}"
          REMOTE_DIR="/${REMOTE_DIR#/}"
          REMOTE_DIR="${REMOTE_DIR%/}"

          find "$LOCAL_DIR" -type f -print0 | while IFS= read -r -d '' file; do
            relative="${file#"$LOCAL_DIR"/}"
            remote_path="${REMOTE_DIR}/${relative}"

            echo "Uploading ${relative}"

            curl               --fail               --silent               --show-error               --ftp-create-dirs               --disable-epsv               --retry 5               --retry-all-errors               --retry-delay 3               --connect-timeout 30               --user "$FTP_USERNAME:$FTP_PASSWORD"               --upload-file "$file"               "ftp://${FTP_HOST}:${FTP_PORT}${remote_path}"
          done
