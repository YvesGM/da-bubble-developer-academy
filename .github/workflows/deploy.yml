name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dabubble-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular production bundle
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: npm run build -- --configuration production

      - name: Setup PHP for password-reset mail handler
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Install PHP mailer and Firebase Admin dependencies
        working-directory: backend/password-reset
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Lint server-side PHP sources
        run: find backend/password-reset -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Validate Firebase reset link transformation
        run: |
          php backend/password-reset/tests/reset-link.test.php
          php backend/password-reset/tests/private-directory.test.php

      - name: Run deployment and reset staging tests; package PHP
        run: |
          npm run test:reset
          node --test tests/deploy-allinkl.test.mjs
          node scripts/stage-password-reset.mjs

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy DABubble to ALL-INKL via FTPS
        env:
          FTP_HOST: ${{ secrets.ALLINKL_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.ALLINKL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.ALLINKL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Missing ALLINKL_FTP_HOST}"
          : "${FTP_USERNAME:?Missing ALLINKL_FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing ALLINKL_FTP_PASSWORD}"
          if [[ "$FTP_HOST" == *developerakademie* ]]; then
            echo "Refusing deployment to the former Developer Akademie server."
            exit 1
          fi
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "ftp://$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          mirror --reverse --verbose ./dist/dabubble/browser/ /schniefs-portfolio.de/projects/dabubble/
          bye
          EOF
